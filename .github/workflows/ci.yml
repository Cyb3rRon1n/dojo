name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check python
        run: python -m py_compile dojo-tokens.py
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Run bats tests
        run: bats tests/
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Shellcheck scripts
        run: shellcheck -S warning dojo bootstrap.sh install.sh copilot/statusline.sh
      - name: Syntax-check PowerShell ports
        run: |
          pwsh -NoProfile -Command '
            $bad = 0
            foreach ($f in @("bootstrap.ps1", "install.ps1", "copilot/statusline.ps1")) {
              $tokens = $null; $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Join-Path (Get-Location) $f), [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count) {
                $bad = 1
                $errors | ForEach-Object {
                  Write-Host ("{0}:{1}: {2}" -f $f, $_.Extent.StartLineNumber, $_.Message)
                }
              }
            }
            if ($bad) { exit 1 }
            Write-Host "ps1 parse ok"
          '