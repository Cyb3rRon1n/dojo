# Forward proxy with a domain allowlist — everything not listed in
# allowed-domains.txt is refused. The workspace container reaches this over
# the internal-only "egress" network; it has no other route out (see
# docker-compose.egress.yml).
http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT SSL_ports allowed_domains
http_access allow allowed_domains
http_access deny all

# Squid's default disk cache; a homelab dev box has no need to persist a
# response cache across restarts.
cache deny all
