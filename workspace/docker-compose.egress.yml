# Optional overlay: force the workspace's outbound traffic through a
# domain-allowlisted forward proxy (squid) instead of the open internet, so
# a poisoned dependency or an indirect-prompt-injected agent can't exfiltrate
# to an arbitrary host even with your API keys and GitHub token in hand.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.egress.yml up -d --build
#
# Edit workspace/egress/allowed-domains.txt for what the agents you actually
# run need to reach (Anthropic/OpenAI APIs, GitHub, npm/PyPI, the VS Code
# marketplace ship by default) — anything else, including a custom
# ANTHROPIC_BASE_URL/OPENAI_BASE_URL, gets refused until you add it.
#
# This makes the workspace's default network internal-only — its one route
# out is egress-proxy. Combine with docker-compose.proxy.yml freely: that
# overlay only adds the workspace to a second (external) `proxy` network for
# Traefik, it doesn't touch the internal one.

services:
  workspace:
    environment:
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      no_proxy: localhost,127.0.0.1
    depends_on:
      - egress-proxy

  egress-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    networks:
      - default
      - egress-out
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
      - ./egress/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro

networks:
  default:
    internal: true
  egress-out: {}
