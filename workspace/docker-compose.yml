name: dojo-workspace

# A browser IDE with the coding-agent CLIs + dojo's optimizer stack baked in.
#   1. create .env alongside this file:
#        WORKSPACE_PASSWORD=your-password      (required)
#        ANTHROPIC_API_KEY=...   OPENAI_API_KEY=...   GITHUB_TOKEN=...   (optional)
#   2. docker compose up -d --build
#   3. open the reverse-proxied URL (or uncomment `ports` for LAN/testing)
#
# SECURITY: do not publish this straight to the internet. Put it behind a VPN
# (Tailscale/WireGuard) or an authenticating proxy (Authelia/Authentik). The
# agents hold your API keys and a GitHub token; a container is not a hard
# isolation boundary.

services:
  workspace:
    build:
      context: ..
      dockerfile: workspace/Dockerfile
    image: dojo-workspace
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Caps whatever runs in this container's terminal (an agent, a manually
    # launched LLM server, anything) to a slice of the host instead of the
    # whole machine. Found live: an unbounded `ollama serve` launched from
    # this workspace pegged all 88 threads and drove cyberpac to 98C (its
    # thermal-critical threshold). Override per-host in .env if needed.
    cpus: ${WORKSPACE_CPU_LIMIT:-16}
    mem_limit: ${WORKSPACE_MEM_LIMIT:-64g}
    # No read_only rootfs here (unlike orca-serve below) — found live:
    # bootstrap.sh re-installs/updates tools into system paths (/usr/local/bin,
    # /opt/uv/tools) on every start, by design, so agent CLI updates land
    # without a rebuild; read-only broke that with real "Read-only file
    # system" failures (rtk's PATH copy, uv tool installs), not just a
    # theoretical risk. no-new-privileges makes fixuid's setuid re-exec a
    # harmless no-op instead (this container never runs under a different
    # UID, so fixuid had nothing to do anyway).
    environment:
      PASSWORD: ${WORKSPACE_PASSWORD:?set WORKSPACE_PASSWORD in .env}
      # Passed through to the agents. Leave blank to log in interactively
      # inside the terminal instead.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Free-text deployment note seeded into ~/projects/CLAUDE.md on first
      # boot (see provision.sh) - e.g. "This runs on cyberpac, 192.168.x.x,
      # alongside the vulcan stack at ~/vulcan/stack." Host-specific, so it
      # belongs in this host's own .env, never in this (public) repo.
      WORKSPACE_HOST_NOTE: ${WORKSPACE_HOST_NOTE:-}
    volumes:
      # Everything the workspace should keep. Tools live in system paths in
      # the image, so this volume never shadows them.
      - home:/home/coder
    # No published port by default — attach this to your reverse-proxy network:
    #   networks: [proxy]
    # For a first run or LAN-only use instead:
    # ports:
    #   - "8443:8080"

  # An always-on Orca agent server, paired to from the Orca DESKTOP/MOBILE
  # app over Tailscale — NOT a browser workspace (orca/Dockerfile explains
  # why). Optional and separate from the tile above. Enable with:
  #   docker compose --profile orca up -d --build orca-serve
  orca-serve:
    build:
      context: ..
      dockerfile: workspace/orca/Dockerfile
    image: dojo-orca-serve
    profiles: ["orca"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Verified live: orca reaches "Orca server ready" under the full
      # read-only + cap-drop ALL + no-new-privileges combination below —
      # Electron's own dbus-connection errors are harmless (no keyring
      # available, so it falls back to storing secrets unencrypted in the
      # /home/orca volume; same as any headless container without dbus).
      - /run
      - /tmp
    environment:
      # Your Tailscale IP for this host — the address advertised to clients.
      ORCA_PAIRING_ADDRESS: ${ORCA_PAIRING_ADDRESS:-}
    volumes:
      - orca-home:/home/orca
    # No published port by default — Tailscale only, per the security
    # section in README. For LAN-only use instead:
    # ports:
    #   - "6768:6768"

volumes:
  home:
  orca-home:
