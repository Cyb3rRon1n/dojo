# Optional overlay: put the workspace behind an existing Vulcan Traefik +
# Authelia install instead of Tailscale/LAN-only access. Vulcan's Authelia
# runs with default_policy: one_factor, so once Traefik routes here with the
# authelia@docker middleware, a login is already required — no Authelia
# config change needed. Recommended extra step below.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
#
# Also set COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml in .env —
# found live: a later bare `docker compose up -d` (a reboot's restart script,
# forgetting the -f flags) silently drops this overlay, no error, and the
# container comes back without Traefik routing or the proxy network at all.
#
# Requires, in .env:
#   TRAEFIK_NETWORK=<vulcan's compose project name>_default   # e.g. stack_default
#   WORKSPACE_DOMAIN=workspace.yourdomain.tld
#   TRAEFIK_CERTRESOLVER=cloudflare   # only if Vulcan's Traefik uses Cloudflare DNS-01; omit otherwise
#   TRAEFIK_ENTRYPOINTS=websecure,tunnel   # only if Vulcan's Traefik has cloudflared enabled — every
#                                          # other router there carries ",tunnel" (its own tunnel-only
#                                          # entrypoint, vulcan's --entrypoints.tunnel.address=:8081) and
#                                          # without it Cloudflare reaches Traefik but Traefik has no
#                                          # router listening on that entrypoint for this Host, so it
#                                          # answers its own 404 — found live, not a hypothetical: grep
#                                          # `entrypoints=websecure,tunnel` in Vulcan's docker-compose.yml
#                                          # to confirm whether your install needs this. Omit otherwise.
#
# Find Vulcan's real network name with: docker network ls | grep -i default
# (it's <the directory Vulcan's docker-compose.yml lives in>_default, not
# necessarily literally "vulcan").
#
# Recommended: add `workspace.${WORKSPACE_DOMAIN}` to Vulcan's own
# `admin_only_services` so this — the one service that holds your agent API
# keys and a GitHub token — needs the admin group, not just one_factor.

services:
  workspace:
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      # This service sits on two networks (default + proxy) - without this,
      # Traefik's docker provider can pick the one it has no route to at all
      # (found live: it did), dial that unreachable IP, and hang until
      # Cloudflare's edge times out (~100s -> 504/524). Only ever bites the
      # authenticated pass-through - Authelia's own redirect for an
      # unauthenticated request fires before Traefik tries to reach this
      # service at all, so that path always looked fine.
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.workspace.rule=Host(`${WORKSPACE_DOMAIN}`)"
      - "traefik.http.routers.workspace.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.workspace.tls=true"
      - "traefik.http.routers.workspace.tls.certresolver=${TRAEFIK_CERTRESOLVER:-}"
      - "traefik.http.routers.workspace.middlewares=authelia@docker"
      - "traefik.http.services.workspace.loadbalancer.server.port=8080"

networks:
  default: {}
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env to Vulcan's compose network}
